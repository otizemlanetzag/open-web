<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWeb Joining Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .form-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .hint { font-size: 13px; color: #666; font-weight: normal; margin-top: -4px; margin-bottom: 8px; display: block; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        
        /* Yes/No Question Styling */
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-option input { cursor: pointer; width: 18px; height: 18px; }
        
        button { background-color: #000000; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #333333; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>OpenWeb Joining Form</h2>
    
    <!-- FormSubmit requires the recipient email after a slash in the endpoint URL. -->
    <form action="https://formsubmit.co/openweb@zohomail.com" method="POST" accept-charset="UTF-8">
        <input type="hidden" name="_subject" value="New OpenWeb joining form submission">
        
        <!-- Name Field -->
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" name="name" id="name" required>
        </div>

        <!-- Yes/No Question -->
        <div class="form-group">
            <label>Are you joining?</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="joining" value="yes" required>
                    Yes, I'm joining!
                </label>
                <label class="radio-option">
                    <input type="radio" name="joining" value="no">
                    No, unfortunately not.
                </label>
            </div>
        </div>

        <!-- Product Name Field -->
        <div class="form-group">
            <label for="products">Product Name:</label>
            <span class="hint">If there is more than one, separate them with a "."</span>
            <input type="text" name="products" id="products" placeholder="Product A. Product B">
        </div>

        <!-- Message Field -->
        <div class="form-group">
            <label for="message">Message / Content:</label>
            <textarea name="message" id="message" rows="5" required></textarea>
        </div>

        <!-- FormSubmit Spam Protection -->
        <input type="hidden" name="_captcha" value="false">

        <button type="submit">Submit Form</button>
    </form>
</div>

</body>
</html>
